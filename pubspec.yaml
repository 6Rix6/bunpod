name: bunpod
description: Open-source podcast player app with Flutter and Material 3 Expressive.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.10.3'
  flutter: '^3.38.4'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  motor: ^1.1.0
  gap: ^3.0.1
  image_fade: ^0.6.2
  extended_image: ^10.0.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  get_it: ^9.2.1
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  logarte: ^1.5.0
  expressive_sheet:
    path: packages/expressive_sheet
  expressive_snack:
    path: packages/expressive_snack
  expressive_loading_indicator:
    path: packages/expressive_loading_indicator
  expressive_refresh_indicator:
    path: packages/expressive_refresh_indicator
  material_shapes:
    path: packages/material_shapes
  material_wavy_progress_indicator:
    path: packages/material_wavy_progress_indicator

  audio_service: ^0.18.19
  just_audio: ^0.10.6

  freezed_annotation: ^3.1.0
  json_serializable: ^6.14.1
  pool: ^1.5.3

  apple_podcast_api:
    path: packages/apple_podcast_api
  material_color_utilities: ^0.13.0
  fpdart: ^1.2.0

  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  dio: ^5.11.0

dependency_overrides:
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  freezed: ^4.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app-icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/vectors/
    - assets/images/

